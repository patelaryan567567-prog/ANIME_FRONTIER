<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeFrontier</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Added 'Inter' for a more professional sans-serif font -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* General Reset & Body */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0c 0%, #1a1a1e 100%); /* Darker, more subtle background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif; /* New professional font */
            overflow: hidden; /* Prevent scrollbars during animation */
            color: #e0e0e0; /* Default text color */
        }
        
        /* Opening Container */
        .opening-container {
            text-align: center;
            position: relative;
            opacity: 0; /* Start hidden for initial fade-in */
            animation: fadeInContainer 1s ease-out forwards;
        }
        
        /* Logo Container */
        .logo-container {
            position: relative;
            margin-bottom: 40px;
        }
        
        /* Logo Circle */
        .logo-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #f06292); /* Softer red/pink gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6); /* Softer shadow */
            position: relative;
            transform: scale(0.8); /* Start smaller */
            opacity: 0; /* Start hidden */
            /* Bouncy scale-in animation */
            animation: scaleInCircle 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards 0.5s; 
        }
        
        /* Ripple effect - single, more elegant */
        .logo-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 107, 0.5);
            animation: rippleEffect 2s ease-out infinite; /* Single ripple */
        }
        
        /* Icon inside circle */
        .logo-circle i {
            font-size: 48px;
            color: white;
            transform: scale(0); /* Start hidden */
            /* Pop-in effect for the icon */
            animation: iconPopIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards 1s; 
        }
        
        /* Logo Text */
        .logo-text {
            font-family: 'Bangers', cursive;
            font-size: 4.5rem; /* Use rem for better scaling */
            background: linear-gradient(to right, #ff6b6b, #ffd700); /* Matching gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
            transform: translateY(20px); /* Start lower */
            opacity: 0; /* Start hidden */
            /* Smoother slide-in animation */
            animation: slideInText 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 1.2s; 
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Subtle shadow */
        }
        
        /* Logo Subtitle */
        .logo-subtitle {
            font-family: 'Inter', sans-serif; /* Use new font */
            color: #ffd700; /* Gold accent */
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0; /* Start hidden */
            animation: fadeInSubtitle 1s ease-out forwards 1.8s; /* Fade in */
        }
        
        /* Loading Bar */
        .loading-bar {
            width: 300px;
            height: 6px; /* Slightly thicker */
            background: rgba(255, 255, 255, 0.08); /* More subtle background */
            border-radius: 3px;
            margin: 40px auto 20px; /* Adjusted margin */
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2); /* Inner shadow */
            opacity: 0; /* Start hidden */
            animation: fadeInBar 0.8s ease-out forwards 2.2s; /* Fade in */
        }
        
        .loading-progress {
            position: absolute;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b6b, #ffd700); /* Matching gradient */
            border-radius: 3px;
            animation: loadingProgress 3s ease-in-out forwards 2.5s; /* Adjusted timing */
        }
        
        /* Loading Text */
        .loading-text {
            font-family: 'Inter', sans-serif; /* Use new font */
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 10px;
            opacity: 0; /* Start hidden */
            animation: fadeInLoadingText 0.8s ease-out forwards 2.8s; /* Fade in */
        }

        /* Made By Text - Added for "made by Aryan" */
        .made-by-text {
            font-family: 'Inter', sans-serif;
            color: rgba(255, 255, 255, 0.4); /* More subtle color */
            font-size: 0.7rem; /* Slightly smaller */
            letter-spacing: 1px;
            margin-top: 15px; /* Space it out from loading text */
            opacity: 0; /* Start hidden */
            animation: fadeInMadeBy 0.8s ease-out forwards 3.5s; /* Fade in after loading text */
        }

        /* Final fade out for the container */
        .opening-container.fade-out {
            animation: fadeOutContainer 0.8s ease-out forwards;
        }
        
        /* Keyframes */
        
        /* Container fade in/out */
        @keyframes fadeInContainer {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeOutContainer {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); } /* Fades out and moves up slightly */
        }
        
        /* Logo Circle animations */
        @keyframes scaleInCircle {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; } /* Overshoot for bouncy effect */
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes rippleEffect {
            0% { transform: scale(1); opacity: 1; border-width: 2px; }
            100% { transform: scale(1.4); opacity: 0; border-width: 0px; } /* More subtle ripple */
        }
        
        @keyframes iconPopIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; } /* Overshoot for bouncy effect */
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Logo Text animation */
        @keyframes slideInText {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        /* Subtitle fade in */
        @keyframes fadeInSubtitle {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        /* Loading Bar fade in */
        @keyframes fadeInBar {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        /* Loading Progress animation */
        @keyframes loadingProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        /* Loading Text fade in */
        @keyframes fadeInLoadingText {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Keyframes for Made By Text - Added */
        @keyframes fadeInMadeBy {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            .logo-circle {
                width: 90px;
                height: 90px;
            }
            
            .logo-circle i {
                font-size: 36px;
            }
            
            .logo-text {
                font-size: 3rem;
                letter-spacing: 2px;
            }
            
            .logo-subtitle {
                font-size: 0.7rem;
                letter-spacing: 4px;
            }
            
            .loading-bar {
                width: 250px;
                margin-top: 30px;
            }
            
            .loading-text {
                font-size: 0.7rem;
            }

            .made-by-text { /* Adjust for smaller screens if needed */
                font-size: 0.6rem;
            }

    /* Made By Text - DHAMAKEDAR Animation */
    .made-by-text {
        font-family: 'Bangers', cursive;
        font-size: 1.1rem;
        letter-spacing: 3px;
        margin-top: 30px;
        opacity: 0;
        position: relative;
        display: inline-block;
        text-transform: uppercase;
        padding: 12px 24px;
        animation: 
            explodeIn 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards 3.5s,
            neonPulse 1.5s ease-in-out infinite 4.5s;
    }

    /* धमाकेदार टेक्स्ट स्टाइल */
    .made-by-text strong {
        font-weight: normal;
        background: linear-gradient(
            90deg,
            #ff0000,
            #ff8800,
            #ffff00,
            #00ff00,
            #0088ff,
            #8800ff,
            #ff0088,
            #ff0000
        );
        background-size: 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        text-shadow: 
            0 0 5px rgba(255, 0, 0, 0.7),
            0 0 10px rgba(255, 136, 0, 0.5),
            0 0 15px rgba(255, 255, 0, 0.3);
        animation: fireRainbow 4s linear infinite 4.5s;
    }

    /* 3D EFFECT */
    .made-by-text strong::before {
        content: 'ARYAN';
        position: absolute;
        top: 2px;
        left: 2px;
        background: linear-gradient(90deg, #000000, #333333);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0.5;
        z-index: -1;
        filter: blur(1px);
    }

    /* SPARKLE PARTICLES */
    .made-by-text::after {
        content: '';
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        background: 
            radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.4) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.4) 0%, transparent 50%),
            radial-gradient(circle at 40% 80%, rgba(255, 255, 0, 0.4) 0%, transparent 50%);
        filter: blur(10px);
        z-index: -2;
        opacity: 0;
        animation: particleGlow 3s ease-in-out infinite 4.5s;
    }

    /* GLOWING BORDER */
    .made-by-text::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 15px;
        padding: 2px;
        background: linear-gradient(
            45deg,
            #ff0000,
            #ff8800,
            #ffff00,
            #00ff00,
            #0088ff,
            #8800ff,
            #ff0088,
            #ff0000
        );
        -webkit-mask: 
            linear-gradient(#fff 0 0) content-box, 
            linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        animation: borderFlow 4s linear infinite 4.5s;
    }

    /* KEYFRAMES */

    /* धमाकेदार ENTRY */
    @keyframes explodeIn {
        0% {
            opacity: 0;
            transform: scale(0.1) rotate(-180deg);
            filter: blur(20px);
        }
        50% {
            opacity: 1;
            transform: scale(1.3) rotate(10deg);
            filter: blur(5px);
        }
        70% {
            transform: scale(0.9) rotate(-5deg);
        }
        100% {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            filter: blur(0);
        }
    }

    /* NEON PULSE */
    @keyframes neonPulse {
        0%, 100% {
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.7))
                   drop-shadow(0 0 10px rgba(255, 136, 0, 0.5))
                   drop-shadow(0 0 15px rgba(255, 255, 0, 0.3));
        }
        50% {
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.9))
                   drop-shadow(0 0 20px rgba(255, 136, 0, 0.7))
                   drop-shadow(0 0 30px rgba(255, 255, 0, 0.5))
                   drop-shadow(0 0 40px rgba(0, 255, 0, 0.3));
        }
    }

    /* FIRE RAINBOW COLORS */
    @keyframes fireRainbow {
        0% {
            background-position: 0% 50%;
            text-shadow: 
                0 0 10px rgba(255, 0, 0, 0.9),
                0 0 20px rgba(255, 136, 0, 0.7),
                0 0 30px rgba(255, 255, 0, 0.5);
        }
        25% {
            text-shadow: 
                0 0 10px rgba(255, 136, 0, 0.9),
                0 0 20px rgba(255, 255, 0, 0.7),
                0 0 30px rgba(0, 255, 0, 0.5);
        }
        50% {
            background-position: 100% 50%;
            text-shadow: 
                0 0 10px rgba(0, 255, 0, 0.9),
                0 0 20px rgba(0, 255, 255, 0.7),
                0 0 30px rgba(0, 0, 255, 0.5);
        }
        75% {
            text-shadow: 
                0 0 10px rgba(136, 0, 255, 0.9),
                0 0 20px rgba(255, 0, 255, 0.7),
                0 0 30px rgba(255, 0, 136, 0.5);
        }
        100% {
            background-position: 0% 50%;
            text-shadow: 
                0 0 10px rgba(255, 0, 0, 0.9),
                0 0 20px rgba(255, 136, 0, 0.7),
                0 0 30px rgba(255, 255, 0, 0.5);
        }
    }

    /* BORDER ANIMATION */
    @keyframes borderFlow {
        0% {
            opacity: 0.8;
            background-position: 0% 0%;
        }
        50% {
            opacity: 1;
            background-position: 100% 100%;
        }
        100% {
            opacity: 0.8;
            background-position: 0% 0%;
        }
    }

    /* PARTICLE GLOW */
    @keyframes particleGlow {
        0%, 100% {
            opacity: 0.3;
            transform: scale(1);
        }
        50% {
            opacity: 0.7;
            transform: scale(1.1);
        }
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
        .made-by-text {
            font-size: 0.9rem;
            padding: 8px 16px;
            margin-top: 25px;
        }
    }
    </style>
</head>
<body>
    <div class="opening-container">
        <div class="logo-container">
            <div class="logo-circle">
                <i class="fas fa-play"></i>
            </div>
            <h1 class="logo-text">ANIMEFRONTIER</h1>
            <p class="logo-subtitle">Elite Portal</p>
 
        </div>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <p class="loading-text"></p>
  <p class="made-by-text">Made by ꧁༒ＡＲＹＡＮ༒꧂</p> 
  </div>

    <script>
        const openingContainer = document.querySelector('.opening-container');
        const loadingTextElement = document.querySelector('.loading-text');
        const texts = [
            "LOADING ANIME DATABASE...",
            "INITIALIZING PLAYER...",
            "CONNECTING TO SERVERS...",
            "WELCOME TO ELITE PORTAL..."
        ];
        
        let textIndex = 0;
        let textInterval;

        // Function to update loading text
        function updateLoadingText() {
            loadingTextElement.textContent = texts[textIndex];
            textIndex = (textIndex + 1) % texts.length;
        }

        // Start updating loading text after the fadeInLoadingText animation delay
        // fadeInLoadingText has a delay of 2.8s
        setTimeout(() => {
            updateLoadingText(); // Display first text immediately
            textInterval = setInterval(updateLoadingText, 1000); // Change text every 1 second
        }, 2800); 

        // Total duration for all animations to complete, based on the longest one (loadingProgress)
        // loadingProgress: 3s duration + 2.5s delay = 5.5s
        const totalAnimationTime = 5500; // 5.5 seconds

        setTimeout(() => {
            clearInterval(textInterval); // Stop updating loading text
            loadingTextElement.textContent = "ENTERING ANIMEFRONTIER..."; // Final message
            
            // Trigger fade-out animation for the entire container
            openingContainer.classList.add('fade-out');

            // After fade-out animation completes (0.8s), redirect
            setTimeout(() => {
                sessionStorage.setItem("af_animation_done", "yes");
                console.log("Animation completed, redirecting to main site...");
                window.location.href = 'index.html';
            }, 800); 
            
        }, totalAnimationTime); 
    </script>
</body>
